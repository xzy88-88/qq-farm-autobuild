name: Build QQ Farm updates

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: qq-farm-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch upstream and check published build
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/liyangpengs/qq-farm-bot.git source
          revision=$(git -C source rev-parse HEAD)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          if gh release view "upstream-$revision" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve QQ login and Qmsg compatibility
        if: steps.upstream.outputs.build == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('source')
          def replace(name,old,new):
              p=root/name;s=p.read_text()
              if new in s:return
              if s.count(old)!=1:raise RuntimeError('Compatibility patch needs review: '+name)
              p.write_text(s.replace(old,new))
          replace('core/src/services/qq-login/service.ts',
              "const status = String(task.status || '').trim() as QqLoginTaskStatus;",
              "const rawStatus = String(task.status || '').trim();\n    const status = (rawStatus === 'success' ? 'confirmed' : rawStatus) as QqLoginTaskStatus;")
          replace('core/src/services/qq-login/service.ts','if (!qrImage)',"if (!qrImage && status !== 'confirmed')")
          replace('web/src/components/AccountModal.vue',"if (status === 'confirmed')","if (status === 'confirmed' || status === 'success')")
          replace('web/src/components/AccountModal.vue',
              "if (!taskId || !qrImage)\n      throw new Error('未创建 QQ 登录任务')",
              "if (!taskId)\n      throw new Error('未创建 QQ 登录任务')")
          p=root/'core/src/services/push.ts';s=p.read_text()
          if 'async function sendQmsgV3Message' not in s:
              old=': await pushoo(channel, request);'
              assert s.count(old)==1 and s.count('module.exports = {')==1
              function=r'''
          async function sendQmsgV3Message(payload: any = {}) {
              const token = String(payload.token || '').trim();
              const title = String(payload.title || '').trim();
              const content = String(payload.content || '').trim();
              const parts = token.split('|');
              const key = (parts[0] || '').trim();
              const qq = parts[1] ? parts[1].trim() : '';
              if (!key) throw new Error('Qmsg Key 不能为空');
              const form = new URLSearchParams();
              form.append('msg', title ? `${title}\n${content}` : content);
              if (qq) form.append('qq', qq);
              const response = await axios.post(`https://qmsg.zendee.cn/v3/send/${key}`, form.toString(), {
                  headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, timeout: 15000,
              });
              const data = response && response.data ? response.data : {};
              const ok = !!data.success && Number(data.code) === 0;
              return ok
                  ? { ok: true, code: 'ok', msg: 'ok', raw: data }
                  : { ok: false, code: String(data.code || 'error'), msg: String(data.message || 'Qmsg 推送失败'), raw: data };
          }
          '''
              s=s.replace(old,": channel === 'qmsg'\n                ? await sendQmsgV3Message({ token, title, content })\n                : await pushoo(channel, request);")
              p.write_text(s.replace('module.exports = {',function+'\nmodule.exports = {'))
          p=root/'core/Dockerfile';s=p.read_text()
          s=s.replace('http://localhost:3007/api/game-version','http://127.0.0.1:3007/api/game-version')
          p.write_text(s)
          PY

      - name: Build Linux image on GitHub
        if: steps.upstream.outputs.build == 'true'
        env:
          REVISION: ${{ steps.upstream.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          docker build -f source/core/Dockerfile \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label 'qq-farm.local-compatibility=qmsg-v3,qq-login-confirmed-without-qr' \
            -t "qq-farm-bot:auto-${REVISION:0:12}" source

      - name: Verify startup without real accounts or network
        if: steps.upstream.outputs.build == 'true'
        env:
          REVISION: ${{ steps.upstream.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          image="qq-farm-bot:auto-${REVISION:0:12}"
          docker run --rm --network=none --entrypoint node "$image" -e \
            'require("./dist/services/qq-login/service"); require("./dist/services/push")'
          docker run -d --name farm-check --network=none --tmpfs /app/core/data:rw,size=16m "$image"
          trap 'docker rm -f farm-check >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if [ "$(docker inspect farm-check --format '{{.State.Health.Status}}')" = healthy ]; then
              docker exec farm-check wget -qO- http://127.0.0.1:3007/api/game-version
              docker exec farm-check wget -q --spider http://127.0.0.1:3007/
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish image archive and checksum
        if: steps.upstream.outputs.build == 'true'
        env:
          REVISION: ${{ steps.upstream.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          image="qq-farm-bot:auto-${REVISION:0:12}"
          docker save "$image" | gzip -1 > qq-farm-image.tar.gz
          export IMAGE_TAG="$image"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('qq-farm-image.tar.gz')
          metadata={'revision':os.environ['REVISION'],'image_tag':os.environ['IMAGE_TAG'],
                    'sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest(),'size':p.stat().st_size,
                    'compatibility':['qmsg-v3','qq-login-confirmed-without-qr']}
          pathlib.Path('manifest.json').write_text(json.dumps(metadata,indent=2))
          PY
          gh release create "upstream-$REVISION" qq-farm-image.tar.gz manifest.json \
            --repo "$GITHUB_REPOSITORY" --latest \
            --title "QQ Farm ${REVISION:0:12}" \
            --notes "Automatic build of liyangpengs/qq-farm-bot master commit $REVISION, with QQ login and Qmsg compatibility fixes. No server credentials or account data are included."
